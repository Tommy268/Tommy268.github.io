    <h1>Hextris</h1>
    <p class="lead">六边形版的消除游戏。落下的色块会堆在外圈，转动盘面让同色的连在一起就能消掉。</p>

    </p>

    <div style="width:min(100%,560px)">
      <div id="stage" style="position:relative;width:100%;aspect-ratio:1 / 1;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)">

                data-src="/games/vendor/hextris/index.html"

                style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;font-size:16px;display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center">
          ▶ 开始游戏<span style="font-size:12px;font-weight:400;opacity:.8">约 1.5 MB</span>
        </button>
      </div>
    </div>

    <p class="hint" style="margin-top:18px">操作：点屏幕左半边逆时针转、右半边顺时针转；键盘用 ← → 转，空格暂停。</p>
